[project]
name = "pillow-image-saver"
version = "0.1.0"
description = "Pillow-based direct JPEG saver node for ComfyUI. Recommended image output node for HandpickerSuite."
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
"Pillow>=10.0.0",
]

[project.urls]
Repository = "https://github.com/ruminar/ComfyUI-PillowImageSaver"
Documentation = "https://github.com/ruminar/ComfyUI-PillowImageSaver/blob/main/README.md"
"Bug Tracker" = "https://github.com/ruminar/ComfyUI-PillowImageSaver/issues"

[tool.comfy]
PublisherId = "ruminar"
DisplayName = "Pillow Image Saver"
Icon = "https://raw.githubusercontent.com/ruminar/ComfyUI-PillowImageSaver/main/icon.png"
